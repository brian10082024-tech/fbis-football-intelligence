
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBIS | Football Intelligence</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{background:#111c30;padding:22px 16px;border-bottom:1px solid #26344c}
header h1{margin:0;color:#38bdf8;font-size:25px}
header p{color:#94a3b8;margin:7px 0 0;font-size:13px}
main{padding:16px;max-width:1100px;margin:auto}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
input,button{padding:12px;border-radius:8px;border:1px solid #334155;font-size:14px}
input{background:#172337;color:white;flex:1;min-width:150px}
button{background:#0284c7;color:white;font-weight:bold;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.stat{background:#172337;padding:16px;border-radius:10px}
.stat strong{display:block;font-size:25px;color:#38bdf8}
.stat span{font-size:12px;color:#94a3b8}
h2{font-size:18px;margin:22px 0 12px}
#message{color:#94a3b8;font-size:13px;margin:12px 0}
.match{background:#172337;border:1px solid #293950;padding:15px;border-radius:10px;margin-bottom:10px}
.league{font-size:12px;color:#38bdf8;margin-bottom:12px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:bold}
.teams div{flex:1}
.teams div:last-child{text-align:right}
.score{color:#facc15;white-space:nowrap}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:#94a3b8;font-size:12px}
.empty{text-align:center;padding:30px;color:#94a3b8}
footer{text-align:center;padding:25px;color:#64748b;font-size:12px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>FBIS ⚽</h1>
<p>Football Betting Intelligence System</p>
</header>

<main>
<div class="controls">
<input type="date" id="matchDate">
<button onclick="loadMatches()">Load Matches</button>
<button onclick="loadMatches()">Refresh</button>
</div>

<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Total matches</span></div>
<div class="stat"><strong id="countries">0</strong><span>Countries</span></div>
<div class="stat"><strong id="leagues">0</strong><span>Leagues</span></div>
<div class="stat"><strong id="live">0</strong><span>Live matches</span></div>
</div>

<h2>Football Fixtures</h2>
<div id="message">Loading fixtures...</div>
<div id="matches"></div>
</main>

<footer>FBIS Football Intelligence System | Data provided by Highlightly</footer>

<script>
const API_URL = "https://fbis-football-intelligence.onrender.com";

const dateInput = document.getElementById("matchDate");
dateInput.value = new Date().toLocaleDateString("en-CA");

async function loadMatches(){
 const date = dateInput.value;
 const container = document.getElementById("matches");
 const message = document.getElementById("message");

 if(!date){
   message.textContent = "Please select a date.";
   return;
 }

 container.innerHTML = "";
 message.textContent = "Loading football matches...";

 try{
   const response = await fetch(
     `${API_URL}/matches?date=${encodeURIComponent(date)}`
   );

   const result = await response.json();

   if(!response.ok){
     throw new Error(result.error || "Could not load matches");
   }

   const matches = result.matches || [];

   document.getElementById("total").textContent = matches.length;
   document.getElementById("countries").textContent =
     new Set(matches.map(m=>m.country).filter(Boolean)).size;
   document.getElementById("leagues").textContent =
     new Set(matches.map(m=>m.league).filter(Boolean)).size;
   document.getElementById("live").textContent =
     matches.filter(m=>/live|half|progress/i.test(m.status || "")).length;

   if(matches.length === 0){
     message.textContent = "No matches found for this date.";
     return;
   }

   message.textContent = `${matches.length} matches found`;

   container.innerHTML = matches.map(m=>{
     const score = m.score
       ? `${m.score.home ?? ""} - ${m.score.away ?? ""}`
       : "VS";

     const time = m.date
       ? new Date(m.date).toLocaleTimeString([],{
           hour:"2-digit",minute:"2-digit"
         })
       : "Time unavailable";

     return `
       <div class="match">
         <div class="league">${escapeHTML(m.country || "")} • ${escapeHTML(m.league || "")}</div>
         <div class="teams">
           <div>${escapeHTML(m.home || "")}</div>
           <div class="score">${escapeHTML(String(score))}</div>
           <div>${escapeHTML(m.away || "")}</div>
         </div>
         <div class="meta">
           <span>${escapeHTML(m.status || "Unknown")}</span>
           <span>${escapeHTML(time)} (local)</span>
         </div>
       </div>
     `;
   }).join("");

 }catch(error){
   message.textContent = "Error: " + error.message;
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, c=>({
   "&":"&amp;","<":"&lt;",">":"&gt;",
   '"':"&quot;","'":"&#39;"
 })[c]);
}

loadMatches();
</script>
</body>
</html>
