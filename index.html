
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBIS Football Intelligence</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:#edf4ff;font-family:Arial,sans-serif}
header{background:#10294a;padding:20px;text-align:center}
header h1{margin:0;color:#54b8ff}
header p{color:#b9cde5}
main{max-width:1000px;margin:auto;padding:15px}
.panel,.match,.analysis{background:#10233c;border:1px solid #244568;border-radius:12px;padding:15px;margin-bottom:14px}
input,button{padding:12px;border-radius:7px;border:0;margin:5px 3px}
input{background:white;color:#111}
button{background:#087bd1;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#17375c;padding:12px;border-radius:8px;text-align:center}
.stat strong{display:block;font-size:22px;color:#54b8ff}
.match h3{margin-top:0}
.meta{color:#a9c0dc;font-size:13px}
.analysis{background:#0b1b30}
.analysis h3{color:#54b8ff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metric{background:#17375c;padding:12px;border-radius:8px;overflow-wrap:anywhere}
.metric strong{display:block;font-size:20px;color:#64d5a0;margin-top:5px}
.error{color:#ff9c9c}
.note{color:#ffd27b;font-size:13px}
.good{color:#64d5a0}
.hidden{display:none}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.filters button{background:#244568}
.filters button.active{background:#087bd1}
.section{border-top:1px solid #244568;margin-top:15px;padding-top:10px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10233c;padding:10px;border-radius:8px;font-size:12px}
.small{font-size:12px;color:#a9c0dc}
@media(max-width:550px){
.stats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
<h1>FBIS</h1>
<p>Football Betting Intelligence System</p>
</header>

<main>

<div class="panel">
<h3>Match Centre</h3>
<label for="matchDate">Select match date</label><br>
<input type="date" id="matchDate">
<button onclick="loadMatches()">Load Matches</button>
<button onclick="loadMatches()">Refresh</button>
<p id="status">Ready to load fixtures.</p>
</div>

<div class="stats">
<div class="stat"><strong id="total">0</strong>Matches</div>
<div class="stat"><strong id="countries">0</strong>Countries</div>
<div class="stat"><strong id="leagues">0</strong>Leagues</div>
<div class="stat"><strong id="live">0</strong>Live</div>
</div>

<div class="panel">
<h3>Match Filters</h3>
<div class="filters">
<button class="active" data-filter="upcoming" onclick="setFilter('upcoming',this)">Upcoming 0</button>
<button data-filter="live" onclick="setFilter('live',this)">Live 0</button>
<button data-filter="finished" onclick="setFilter('finished',this)">Finished 0</button>
<button data-filter="postponed" onclick="setFilter('postponed',this)">Postponed 0</button>
<button data-filter="all" onclick="setFilter('all',this)">All 0</button>
</div>
<p id="filterStatus" class="small"></p>
</div>

<div id="matches"></div>

</main>

<script>
const API="https://fbis-football-intelligence.onrender.com";

const dateInput=document.getElementById("matchDate");
dateInput.value=new Date().toLocaleDateString("en-CA");

let allMatches=[];
let currentFilter="upcoming";

function getRows(data){
if(Array.isArray(data))return data;
if(Array.isArray(data?.data))return data.data;
if(Array.isArray(data?.matches))return data.matches;
if(Array.isArray(data?.results))return data.results;
return [];
}

function esc(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function getCategory(status){
const s=String(status||"").toLowerCase();

if(/postponed|cancelled|canceled|abandoned|suspended/.test(s))return "postponed";

if(/finished|full time|after penalties|ended/.test(s))return "finished";

if(/live|playing|in progress|first half|second half|half time|extra time|penalty shootout|break/.test(s))return "live";

if(/not started|scheduled|fixture|pending/.test(s))return "upcoming";

return "other";
}

function updateFilters(){
const counts={
upcoming:0,live:0,finished:0,postponed:0,all:allMatches.length
};

allMatches.forEach(m=>{
const category=getCategory(m.status);
if(counts[category]!==undefined)counts[category]++;
});

document.querySelectorAll("[data-filter]").forEach(button=>{
const key=button.dataset.filter;
button.textContent=
key.charAt(0).toUpperCase()+key.slice(1)+" "+counts[key];
});

document.getElementById("live").textContent=counts.live;
}

function setFilter(filter,button){
currentFilter=filter;

document.querySelectorAll("[data-filter]").forEach(b=>
b.classList.remove("active")
);

button.classList.add("active");
renderMatches();
}

function renderMatches(){
const container=document.getElementById("matches");

let filtered=allMatches.filter(m=>
currentFilter==="all" || getCategory(m.status)===currentFilter
);

filtered.sort((a,b)=>new Date(a.date)-new Date(b.date));

document.getElementById("filterStatus").textContent=
`Showing ${filtered.length} ${currentFilter} matches.`;

if(!filtered.length){
container.innerHTML="<p>No matches found in this category.</p>";
return;
}

container.innerHTML=filtered.map(m=>`
<div class="match">
<h3>${esc(m.home)} vs ${esc(m.away)}</h3>
<p class="meta">${esc(m.league)} · ${esc(m.country)}</p>
<p class="meta">${esc(m.date)} · ${esc(m.status)}</p>
<p>Score: ${esc(m.score||"Not available")}</p>
<button onclick="analyzeMatch(${Number(m.id)},${Number(m.homeTeamId)},${Number(m.awayTeamId)},this)">
Analyze Match
</button>
<div class="analysis hidden"></div>
</div>
`).join("");
}

async function loadMatches(){
const date=dateInput.value;
if(!date)return;

const container=document.getElementById("matches");
container.innerHTML="";
document.getElementById("status").textContent="Loading fixtures...";

try{
const response=await fetch(`${API}/matches?date=${encodeURIComponent(date)}`);
const data=await response.json();

if(!response.ok)throw new Error(data.error||"Could not load fixtures");

allMatches=data.matches||[];

document.getElementById("total").textContent=allMatches.length;
document.getElementById("countries").textContent=new Set(allMatches.map(m=>m.country)).size;
document.getElementById("leagues").textContent=new Set(allMatches.map(m=>m.league)).size;

document.getElementById("status").textContent=
`${allMatches.length} matches loaded for ${date}.`;

updateFilters();
renderMatches();

}catch(error){
document.getElementById("status").innerHTML=
`<span class="error">${esc(error.message)}</span>`;
}
}

function summarizeForm(data,id){
const rows=getRows(data);
let wins=0,draws=0,losses=0,gf=0,ga=0,played=0;

for(const m of rows){
const score=m.state?.score?.current;
if(!score)continue;

const parts=String(score).split("-").map(Number);
if(parts.length!==2||parts.some(n=>!Number.isFinite(n)))continue;

const home=Number(m.homeTeam?.id)===Number(id);
const away=Number(m.awayTeam?.id)===Number(id);
if(!home&&!away)continue;

const scored=home?parts[0]:parts[1];
const conceded=home?parts[1]:parts[0];

gf+=scored;
ga+=conceded;
played++;

if(scored>conceded)wins++;
else if(scored===conceded)draws++;
else losses++;
}

return {played,wins,draws,losses,gf,ga};
}

function metric(label,value){
if(value===undefined||value===null)return "";
return `<div class="metric">${esc(label)}<strong>${esc(value)}%</strong></div>`;
}

function showObject(data){
if(!data)return "No information returned.";
return esc(JSON.stringify(data,null,2));
}

async function safeFetch(url){
try{
const response=await fetch(url);
const data=await response.json();
return {ok:response.ok,data};
}catch(error){
return {ok:false,data:{error:error.message}};
}
}

async function analyzeMatch(matchId,homeId,awayId,button){
const panel=button.nextElementSibling;

panel.classList.remove("hidden");
panel.innerHTML="<p>Loading match intelligence...</p>";
button.disabled=true;

try{
const urls=[
`${API}/team-form/${homeId}`,
`${API}/team-form/${awayId}`,
`${API}/h2h?team1=${homeId}&team2=${awayId}`,
`${API}/predict?home=${homeId}&away=${awayId}`,
`${API}/lineups/${matchId}`,
`${API}/player-availability/${matchId}`,
`${API}/match-details/${matchId}`,
`${API}/match-statistics/${matchId}`,
`${API}/events/${matchId}`
];

const results=await Promise.all(urls.map(safeFetch));

const homeData=results[0].data;
const awayData=results[1].data;
const h2hData=results[2].data;
const prediction=results[3].data;
const lineups=results[4].data;
const availability=results[5].data;
const details=results[6].data;
const statistics=results[7].data;
const events=results[8].data;

const h=summarizeForm(homeData,homeId);
const a=summarizeForm(awayData,awayId);
const h2h=getRows(h2hData);

let homeWins=0,draws=0,awayWins=0;

for(const m of h2h){
const score=m.state?.score?.current;
if(!score)continue;

const parts=String(score).split("-").map(Number);
if(parts.length!==2||parts.some(n=>!Number.isFinite(n)))continue;

if(parts[0]>parts[1])homeWins++;
else if(parts[0]===parts[1])draws++;
else awayWins++;
}

const p=prediction.probabilities||{};

const probabilityHTML=results[3].ok?`
<div class="section">
<h3>Probability Estimates</h3>
<div class="grid">
${metric("Home win",p.homeWin)}
${metric("Draw",p.draw)}
${metric("Away win",p.awayWin)}
${metric("BTTS Yes",p.bttsYes)}
${metric("BTTS No",p.bttsNo)}
${metric("Over 0.5 goals",p.over05)}
${metric("Over 1.5 goals",p.over15)}
${metric("Over 2.5 goals",p.over25)}
${metric("Over 3.5 goals",p.over35)}
${metric("Under 2.5 goals",p.under25)}
${metric("Under 3.5 goals",p.under35)}
${metric("Home clean sheet",p.homeCleanSheet)}
${metric("Away clean sheet",p.awayCleanSheet)}
${metric("Home or draw",p.homeOrDraw)}
${metric("Away or draw",p.awayOrDraw)}
</div>
<p>Expected goals: Home ${esc(prediction.estimatedGoals?.home??"N/A")} · Away ${esc(prediction.estimatedGoals?.away??"N/A")}</p>
<p class="note">${esc(prediction.warning||prediction.message||"Experimental estimates only.")}</p>
</div>
`:`<div class="section"><h3>Probability Estimates</h3><p class="note">${esc(prediction.error||"Prediction unavailable.")}</p></div>`;

const homeStrength=prediction.home||{};
const awayStrength=prediction.away||{};
const strength=prediction.strengthComparison||{};

const strengthHTML=`
<div class="section">
<h3>Team Strength Comparison</h3>
<div class="grid">
<div class="metric">Home team
<p>Matches: ${esc(homeStrength.played??homeStrength.matches??h.played)}</p>
<p>Wins: ${esc(homeStrength.wins??h.wins)}</p>
<p>Draws: ${esc(homeStrength.draws??h.draws)}</p>
<p>Losses: ${esc(homeStrength.losses??h.losses)}</p>
<p>Goals scored: ${esc(homeStrength.averageGoalsScored!==undefined?Number(homeStrength.averageGoalsScored).toFixed(2):h.gf)}</p>
<p>Goals conceded: ${esc(homeStrength.averageGoalsConceded!==undefined?Number(homeStrength.averageGoalsConceded).toFixed(2):h.ga)}</p>
<p>Points per game: ${esc(strength.homePointsPerGame??"Unavailable")}</p>
</div>
<div class="metric">Away team
<p>Matches: ${esc(awayStrength.played??awayStrength.matches??a.played)}</p>
<p>Wins: ${esc(awayStrength.wins??a.wins)}</p>
<p>Draws: ${esc(awayStrength.draws??a.draws)}</p>
<p>Losses: ${esc(awayStrength.losses??a.losses)}</p>
<p>Goals scored: ${esc(awayStrength.averageGoalsScored!==undefined?Number(awayStrength.averageGoalsScored).toFixed(2):a.gf)}</p>
<p>Goals conceded: ${esc(awayStrength.averageGoalsConceded!==undefined?Number(awayStrength.averageGoalsConceded).toFixed(2):a.ga)}</p>
<p>Points per game: ${esc(strength.awayPointsPerGame??"Unavailable")}</p>
</div>
</div>
</div>`;

const lineupHTML=`
<div class="section">
<h3>Lineups and Formations</h3>
<p>${lineups.available===false?"Lineups not available yet.":lineups.available===true?"Lineup data received from provider.":"Lineup status not confirmed."}</p>
${lineups.homeTeam?`<p><b>Home:</b> ${showObject(lineups.homeTeam)}</p>`:""}
${lineups.awayTeam?`<p><b>Away:</b> ${showObject(lineups.awayTeam)}</p>`:""}
${!lineups.homeTeam&&!lineups.awayTeam?`<p class="small">${esc(lineups.message||"No confirmed lineup details returned.")}</p>`:""}
</div>`;

const availabilityHTML=`
<div class="section">
<h3>Injuries and Suspensions</h3>
<p class="note">${esc(availability.message||"Availability information not verified.")}</p>
</div>`;

const detailsHTML=`
<div class="section">
<h3>Match Details, Venue and Weather</h3>
${details.available===true?`<pre>${showObject(details.match)}</pre>`:`<p class="small">${esc(details.message||details.error||"Match details unavailable.")}</p>`}
</div>`;

const statsHTML=`
<div class="section">
<h3>Match Statistics</h3>
${statistics.available===true?`<pre>${showObject(statistics.statistics)}</pre>`:`<p class="small">${esc(statistics.message||statistics.error||"Statistics unavailable.")}</p>`}
</div>`;

const eventsHTML=`
<div class="section">
<h3>Match Events</h3>
${events.available===true?`<pre>${showObject(events.events)}</pre>`:`<p class="small">${esc(events.message||events.error||"Events unavailable.")}</p>`}
</div>`;

panel.innerHTML=`
<h3>Recent Form</h3>
<div class="grid">
<div class="metric">Home team
<p>${h.wins} wins · ${h.draws} draws · ${h.losses} losses</p>
<p>Goals: ${h.gf} scored · ${h.ga} conceded</p>
</div>
<div class="metric">Away team
<p>${a.wins} wins · ${a.draws} draws · ${a.losses} losses</p>
<p>Goals: ${a.gf} scored · ${a.ga} conceded</p>
</div>
</div>

<div class="section">
<h3>Head-to-Head</h3>
<p>Meetings found: ${h2h.length}</p>
<p>Home wins: ${homeWins} · Draws: ${draws} · Away wins: ${awayWins}</p>
</div>

${strengthHTML}
${probabilityHTML}
${lineupHTML}
${availabilityHTML}
${detailsHTML}
${statsHTML}
${eventsHTML}

<p class="note">FBIS estimates are not guarantees. Missing information is not evidence that a player is available. Verify team news before making decisions.</p>
`;

}catch(error){
panel.innerHTML=`<p class="error">${esc(error.message)}</p>`;
}finally{
button.disabled=false;
}
}

loadMatches();
</script>
</body>
</html>
