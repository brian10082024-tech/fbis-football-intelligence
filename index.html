
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBIS | Football Intelligence</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{background:#111c30;padding:22px 16px;border-bottom:1px solid #26344c}
header h1{margin:0;color:#38bdf8;font-size:25px}
header p{color:#94a3b8;margin:7px 0 0;font-size:13px}
main{padding:16px;max-width:1100px;margin:auto}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
input,button{padding:12px;border-radius:8px;border:1px solid #334155;font-size:14px}
input{background:#172337;color:white;flex:1;min-width:150px}
button{background:#0284c7;color:white;font-weight:bold;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.stat{background:#172337;padding:16px;border-radius:10px}
.stat strong{display:block;font-size:25px;color:#38bdf8}
.stat span{font-size:12px;color:#94a3b8}
h2{font-size:18px;margin:22px 0 12px}
#message{color:#94a3b8;font-size:13px;margin:12px 0}
.match{background:#172337;border:1px solid #293950;padding:15px;border-radius:10px;margin-bottom:10px}
.league{font-size:12px;color:#38bdf8;margin-bottom:12px}
.teams{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:bold}
.teams div{flex:1}
.teams div:last-child{text-align:right}
.score{color:#facc15;white-space:nowrap}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:#94a3b8;font-size:12px}
.analyze{margin-top:14px;width:100%}
.analysis{display:none;margin-top:14px;padding:13px;background:#0b1220;border-radius:8px;font-size:13px;line-height:1.7}
.analysis h3{color:#38bdf8;margin:12px 0 5px}
.analysis p{margin:5px 0}
.empty{text-align:center;padding:30px;color:#94a3b8}
footer{text-align:center;padding:25px;color:#64748b;font-size:12px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>FBIS ⚽</h1>
<p>Football Betting Intelligence System</p>
</header>

<main>
<div class="controls">
<input type="date" id="matchDate">
<button onclick="loadMatches()">Load Matches</button>
<button onclick="loadMatches()">Refresh</button>
</div>

<div class="stats">
<div class="stat"><strong id="total">0</strong><span>Total matches</span></div>
<div class="stat"><strong id="countries">0</strong><span>Countries</span></div>
<div class="stat"><strong id="leagues">0</strong><span>Leagues</span></div>
<div class="stat"><strong id="live">0</strong><span>Live matches</span></div>
</div>

<h2>Football Fixtures</h2>
<div id="message">Loading fixtures...</div>
<div id="matches"></div>
</main>

<footer>FBIS Football Intelligence System | Data provided by Highlightly</footer>

<script>
const API_URL = "https://fbis-football-intelligence.onrender.com";

const dateInput = document.getElementById("matchDate");
dateInput.value = new Date().toLocaleDateString("en-CA");

async function loadMatches(){
 const date = dateInput.value;
 const container = document.getElementById("matches");
 const message = document.getElementById("message");

 if(!date){
   message.textContent = "Please select a date.";
   return;
 }

 container.innerHTML = "";
 message.textContent = "Loading football matches...";

 try{
   const response = await fetch(
     `${API_URL}/matches?date=${encodeURIComponent(date)}`
   );
   const result = await response.json();

   if(!response.ok) throw new Error(result.error || "Could not load matches");

   const matches = result.matches || [];

   document.getElementById("total").textContent = matches.length;
   document.getElementById("countries").textContent =
     new Set(matches.map(m=>m.country).filter(Boolean)).size;
   document.getElementById("leagues").textContent =
     new Set(matches.map(m=>m.league).filter(Boolean)).size;
   document.getElementById("live").textContent =
     matches.filter(m=>/live|half|progress/i.test(m.status || "")).length;

   if(matches.length === 0){
     message.textContent = "No matches found for this date.";
     return;
   }

   message.textContent = `${matches.length} matches found`;

   container.innerHTML = matches.map(m=>{
     const score = m.score
       ? `${m.score.home ?? ""} - ${m.score.away ?? ""}`
       : "VS";

     const time = m.date
       ? new Date(m.date).toLocaleTimeString([],{
           hour:"2-digit",minute:"2-digit"
         })
       : "Time unavailable";

     return `
       <div class="match">
         <div class="league">${escapeHTML(m.country || "")} • ${escapeHTML(m.league || "")}</div>
         <div class="teams">
           <div>${escapeHTML(m.home || "")}</div>
           <div class="score">${escapeHTML(String(score))}</div>
           <div>${escapeHTML(m.away || "")}</div>
         </div>
         <div class="meta">
           <span>${escapeHTML(m.status || "Unknown")}</span>
           <span>${escapeHTML(time)} (local)</span>
         </div>
         <button class="analyze"
           data-home-id="${Number(m.homeTeamId)}"
           data-away-id="${Number(m.awayTeamId)}"
           data-home="${escapeHTML(m.home || "")}"
           data-away="${escapeHTML(m.away || "")}"
           data-match-id="${escapeHTML(String(m.id))}">
           Analyze Match
         </button>
         <div class="analysis" id="analysis-${escapeHTML(String(m.id))}"></div>
       </div>
     `;
   }).join("");

   document.querySelectorAll(".analyze").forEach(button=>{
     button.addEventListener("click",()=>{
       analyzeMatch(button);
     });
   });

 }catch(error){
   message.textContent = "Error: " + error.message;
 }
}

function getRows(data){
 if(Array.isArray(data)) return data;
 if(Array.isArray(data.data)) return data.data;
 if(Array.isArray(data.matches)) return data.matches;
 return [];
}

function getScore(match){
 const value = match.state?.score?.current;
 if(!value) return null;
 const parts = String(value).split("-");
 if(parts.length !== 2) return null;
 const home = Number(parts[0].trim());
 const away = Number(parts[1].trim());
 if(!Number.isFinite(home) || !Number.isFinite(away)) return null;
 return {home,away};
}

function summarizeForm(matches,teamId){
 let wins=0,draws=0,losses=0,scored=0,conceded=0,played=0;

 matches.forEach(match=>{
   const score=getScore(match);
   if(!score) return;

   const homeId=Number(match.homeTeam?.id);
   const awayId=Number(match.awayTeam?.id);

   let goalsFor,goalsAgainst;

   if(homeId===teamId){
     goalsFor=score.home;
     goalsAgainst=score.away;
   }else if(awayId===teamId){
     goalsFor=score.away;
     goalsAgainst=score.home;
   }else{
     return;
   }

   played++;
   scored+=goalsFor;
   conceded+=goalsAgainst;

   if(goalsFor>goalsAgainst) wins++;
   else if(goalsFor===goalsAgainst) draws++;
   else losses++;
 });

 return {wins,draws,losses,scored,conceded,played};
}

function formText(name,form){
 if(form.played===0) return `<p><b>${escapeHTML(name)}:</b> No completed matches found.</p>`;

 return `
 <p><b>${escapeHTML(name)}</b></p>
 <p>Wins: ${form.wins} | Draws: ${form.draws} | Losses: ${form.losses}</p>
 <p>Goals scored: ${form.scored} | Goals conceded: ${form.conceded}</p>
 <p>Points: ${form.wins*3+form.draws} / ${form.played*3}</p>
 `;
}

async function analyzeMatch(button){
 const homeId=Number(button.dataset.homeId);
 const awayId=Number(button.dataset.awayId);
 const home=button.dataset.home;
 const away=button.dataset.away;
 const panel=document.getElementById("analysis-"+button.dataset.matchId);

 if(!homeId || !awayId){
   panel.style.display="block";
   panel.textContent="Team IDs are missing for this match.";
   return;
 }

 panel.style.display="block";
 panel.innerHTML="Loading recent form and H2H data...";
 button.disabled=true;

 try{
   const [homeResponse,awayResponse,h2hResponse]=await Promise.all([
     fetch(`${API_URL}/team-form/${homeId}`),
     fetch(`${API_URL}/team-form/${awayId}`),
     fetch(`${API_URL}/h2h?team1=${homeId}&team2=${awayId}`)
   ]);

   const [homeData,awayData,h2hData]=await Promise.all([
     homeResponse.json(),awayResponse.json(),h2hResponse.json()
   ]);

   if(!homeResponse.ok) throw new Error("Home team form could not be loaded.");
   if(!awayResponse.ok) throw new Error("Away team form could not be loaded.");
   if(!h2hResponse.ok) throw new Error("H2H data could not be loaded.");

   const homeForm=summarizeForm(getRows(homeData),homeId);
   const awayForm=summarizeForm(getRows(awayData),awayId);

   const meetings=getRows(h2hData);
   const h2h=summarizeForm(meetings,homeId);

   panel.innerHTML=`
     <h3>Recent form</h3>
     ${formText(home,homeForm)}
     ${formText(away,awayForm)}
     <h3>Head-to-head</h3>
     <p>Meetings found: ${h2h.played}</p>
     <p>${escapeHTML(home)} wins: ${h2h.wins}</p>
     <p>Draws: ${h2h.draws}</p>
     <p>${escapeHTML(away)} wins: ${h2h.losses}</p>
     <p><b>Note:</b> These are historical records, not predictions. No probability or betting recommendation is generated yet.</p>
   `;

 }catch(error){
   panel.textContent="Analysis error: "+error.message;
 }finally{
   button.disabled=false;
 }
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
   "&":"&amp;","<":"&lt;",">":"&gt;",
   '"':"&quot;","'":"&#39;"
 })[c]);
}

loadMatches();
</script>
</body>
</html>
